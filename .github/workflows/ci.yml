name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build all packages (dist required for cross-pkg + example typecheck)
        run: bun run --filter './packages/*' build

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Unit tests
        run: bun test packages

      # The docs site prerenders every page and fails the build on a dead
      # internal link. Deploying only happens on a `v*` tag, so without this
      # step a broken link sits undetected until a release tries to ship it —
      # which is exactly how it last went unnoticed for two months.
      # Packs every package and resolves the publish order without writing to
      # the registry. A tag is otherwise the first time packaging is exercised,
      # and npm versions are immutable — a bad one cannot be taken back.
      - name: Release dry run (packaging + publish order)
        run: bun run release:check

      - name: Build docs (catches dead links before a release does)
        env:
          BASE_PATH: /better-cms
          NODE_ENV: production
        run: bun run --filter '@better-cms-apps/docs' build
